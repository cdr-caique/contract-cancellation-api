name: Create Release Branch

on:
  push:
    branches:
      - develop
  pull_request:
    types:
      - closed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release_branch:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Create release branch from develop
        env:
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -e

          BRANCH_NAME="release/$(date -u +'%Y.%m.%d')-${SOURCE_SHA::7}"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME already exists. Nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

          echo "Created $BRANCH_NAME"
