[tool.black]
line-length = 100
target-version = ["py314"]
include = '\\.pyi?$'
extend-exclude = '''
/(\
    \.venv
  | venv
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
